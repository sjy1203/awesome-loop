tldr:
  en: Foil loops an MoE core whose experts and routers are shared across passes while each pass gets its own attention, and flattens it into fewer, wider layers with more passes at fixed expert parameters and compute; at 100B tokens the most flattened Foil ends 0.012 nat below the unflattened looped baseline.
  zh: Foil 循环一个 MoE 核心块，专家和路由器在各遍之间共享、每遍有独立的注意力，并在专家参数和计算量固定时把它展平为层数更少、每层更宽、遍数更多的结构；在 100B token 时，展平程度最高的 Foil 比未展平的循环基线低 0.012 nat。
