tldr:
  en: DRT builds a lightweight image-deraining Transformer from recursive blocks that reapply shared Swin Transformer blocks with residual connections; it uses only 1.3% of the parameters of the best-performing deraining model while beating state-of-the-art methods on Rain100L by at least 0.33 dB.
  zh: DRT 用递归块构建轻量的图像去雨 Transformer，每个递归块带残差连接并反复调用共享的 Swin Transformer 块；它的参数量只有当前最佳去雨模型的 1.3%，在 Rain100L 上比现有最优方法至少高 0.33 dB。
