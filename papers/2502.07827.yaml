tldr:
  en: Implicit Mamba2 and Llama3 models self-iterate the stack to an approximate fixed point, gaining RNN-like non-linear state transitions that solve the S5 word problem; with a bounded-then-free iteration curriculum up to 1.3B parameters and 207B tokens, they beat explicit counterparts on standard benchmarks.
  zh: 隐式 Mamba2 和 Llama3 模型把整个层栈自迭代到近似不动点，获得类似 RNN 的非线性状态转移，能解决 S5 word problem；采用先限定迭代步数、再放开迭代的课程训练，规模达到 1.3B 参数、207B token，在标准基准上优于对应的显式模型。
