tldr:
  en: DECSC casts the proximal-gradient iterations of convolutional sparse coding, with an embedded Swin Transformer, as one weight-tied layer solved to a fixed point by Anderson acceleration; on 50 ICVL test HSIs with non-i.i.d. Gaussian noise of σ in [0, 95], its 45.64 PSNR is the best among compared methods.
  zh: DECSC 把卷积稀疏编码模型的近端梯度迭代（内嵌 Swin Transformer）写成一个权重共享层，用 Anderson 加速求解其不动点；在 ICVL 的 50 幅测试高光谱图像上，面对 σ 取 [0, 95] 的非独立同分布高斯噪声，PSNR 达到 45.64，为对比方法中最高。
