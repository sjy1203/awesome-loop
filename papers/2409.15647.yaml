tldr:
  en: Trains looped decoder-only Transformers on tasks with known iterative RASP-L solutions, supervising only the final answer after an input-dependent number of steps; adapting the step count at test time improves length generalization.
  zh: 在有已知迭代 RASP-L 解法的任务上训练循环 decoder-only Transformer，只在与输入相关的步数之后监督最终答案；测试时按输入调整循环步数可以改善长度泛化。
