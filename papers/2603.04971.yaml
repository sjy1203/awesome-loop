tldr:
  en: MoUE reuses a shared pool of universal experts across MoE layers under a fixed activation budget; it beats matched MoE baselines by up to 1.3% and converts existing MoE checkpoints with up to 4.2% gains.
  zh: MoUE 在固定的激活预算下让多个 MoE 层复用同一个通用专家池；它比匹配的 MoE 基线最多高 1.3%，并能把已有 MoE checkpoint 转换过来，最多带来 4.2% 的提升。
