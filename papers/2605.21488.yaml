tldr:
  en: Equilibrium Reasoners frame iterative latent reasoning as learning task-conditioned attractors and scale depth and breadth at test time; gains track convergence to solution attractors, reaching over 99% on Sudoku-Extreme versus 2.6% for feedforward models.
  zh: Equilibrium Reasoners 把迭代式隐空间推理视为学习任务条件下的吸引子，并在测试时沿深度和广度扩展计算；收益与向解吸引子的收敛程度紧密相关，在 Sudoku-Extreme 上准确率超过 99%，而前馈模型只有 2.6%。
