tldr:
  en: Shows that a trained recurrent operator's dynamical regime (settling, marginal or drifting) predicts whether extra test-time iterations help, preserve or degrade answers on algorithmic tasks; a terminal fixed-point objective controls the regime.
  zh: 表明训练后循环算子的动力学状态（趋稳、临界或漂移）能预测在算法任务上增加测试时迭代会提升、保持还是损害答案；终端不动点目标可以控制这一状态。
