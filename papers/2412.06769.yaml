tldr:
  en: Coconut feeds the last hidden state back as the next input embedding rather than decoding it into a token; these continuous thoughts can encode alternative next steps, and Coconut outperforms CoT on search-heavy logical reasoning.
  zh: Coconut 不把最后的隐藏状态解码成 token，而是直接作为下一个输入 embedding 送回模型；这种连续思维可以编码多个候选的下一步，Coconut 在需要大量搜索的逻辑推理任务上优于 CoT。
