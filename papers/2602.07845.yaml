tldr:
  en: RD-VLA gives a VLA a weight-tied recurrent action head that stops on latent convergence; tasks failing at one iteration exceed 90 percent success with four, and inference is up to 80x faster than reasoning VLAs.
  zh: RD-VLA 为 VLA 加入权重共享的循环动作头，并按隐状态收敛自适应停止；单次迭代完全失败的任务在四次迭代时成功率超过 90%，推理速度比以往基于推理的 VLA 最多快 80x。
