tldr:
  en: >-
    Technical report for the IQuest-Coder-V1 dense code models (7B-40B), whose 40B Loop variants run all 80 layers twice
    with shared parameters, the second iteration gating between global attention over first-iteration KV and local
    attention; 40B-Loop-Instruct scores 76.2 on SWE-bench Verified against 70.4 for the non-looped 40B-Instruct.
  zh: >-
    IQuest-Coder-V1 dense 代码模型系列（7B-40B）的技术报告；其中 40B Loop 版本以共享参数把全部 80 层跑两遍，第二遍用门控混合对第一遍 KV 的全局注意力和局部注意力；40B-Loop-Instruct 在 SWE-bench Verified 上得 76.2，不循环的 40B-Instruct 为 70.4。
