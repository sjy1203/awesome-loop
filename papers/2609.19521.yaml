  placement: whole-stack
  depth_train: fixed
  kv: n/a
tldr:
  en: On Rule 30, a state-only Block Universal Transformer (BUT) extrapolates and recalls better than CoTFormer, which caches every step's KV; LSTM-UT adds a small bounded gated cell state to the shared block, keeps 99.7% exact-row accuracy at depth 60 after training to depth 12, and beats BUT on OpenWebText2.
  zh: 在 Rule 30 任务上，只保留当前状态的 Block Universal Transformer（BUT）在深度外推和延迟回忆上优于缓存每一步 KV 的 CoTFormer；LSTM-UT 给共享块加入一个小而有界的门控 cell state，训练到深度 12 后在深度 60 仍保持 99.7% 的整行准确率，并在 OpenWebText2 语言建模上优于 BUT。
