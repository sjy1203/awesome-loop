tldr:
  en: SGT loops only the highest-entropy attention heads and grows this recurrence from deeper to shallower layers during training; it outperforms static block-level looping baselines while cutting the extra training FLOPs over a standard Transformer from approximately 16–20% to 1–3%.
  zh: SGT 只对熵最高的注意力头做循环，并在训练中把循环从深层逐步扩展到浅层；它优于训练期静态的块级循环基线，同时把相对标准 Transformer 的额外训练 FLOPs 从约 16–20% 降到 1–3%。
