tldr:
  en: LT2 replaces softmax attention in looped transformers with linear or sparse attention; looping refines linear-attention memory and widens the sparse receptive field, and hybrid variants match or surpass the standard looped transformer at lower cost.
  zh: LT2 把循环 Transformer 中的 softmax 注意力换成线性或稀疏注意力；循环会迭代细化线性注意力的记忆并扩大稀疏注意力的有效感受野，混合变体以更低成本达到或超过标准循环 Transformer。
