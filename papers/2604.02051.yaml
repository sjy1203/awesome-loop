title: "Ouroboros: Dynamic Weight Generation for Recursive Transformers via Input-Conditioned LoRA Modulation"
date: "2026-04-02"
venue: arXiv
authors: [Jaber Jaber, Osama Jaber]
links:
  paper: https://arxiv.org/abs/2604.02051
  code: https://github.com/RightNow-AI/ouroboros
category: architecture/placement
