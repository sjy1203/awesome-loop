tldr:
  en: Expert Tying shares MoE expert weights across groups of consecutive layers while keeping routing and attention per layer; on OLMoE, Qwen3 and DeepSeek-style MoEs it reduces memory footprint by almost 2x, and tying in groups of four cuts total parameters by up to 52% with negligible quality loss.
  zh: Expert Tying 让连续若干层共享 MoE 专家权重，同时保留逐层独立的路由和注意力；在 OLMoE、Qwen3 和 DeepSeek 式 MoE 上，它把内存占用降低近 2x，按每四层一组共享时总参数最多减少 52%，质量损失可忽略。
