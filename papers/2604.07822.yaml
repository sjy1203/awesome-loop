tldr:
  en: Trains recurrent-depth Transformers from scratch on implicit multi-hop knowledge composition; unlike vanilla Transformers they generalize systematically through a three-stage grokking process and extrapolate to deeper compositions with more inference-time iterations, until overthinking degrades predictions.
  zh: 在隐式多跳知识组合任务上从头训练循环深度 Transformer；与普通 Transformer 不同，它们经过三阶段 grokking 实现系统性泛化，并能随推理时迭代次数增加外推到更深的组合，但过度迭代（overthinking）会使预测变差。
