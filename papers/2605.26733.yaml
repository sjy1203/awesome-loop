tldr:
  en: STARS trains looped LMs with Jacobian spectral radius regularization and random loop sampling so latent states approach stable fixed points, giving reliable test-time scaling on arithmetic and less degradation with deeper recurrence in math reasoning.
  zh: STARS 用 Jacobian 谱半径正则和随机循环次数采样训练循环语言模型，使隐状态趋向稳定不动点；在算术任务上实现可靠的 test-time scaling，在数学推理中循环加深时性能下降更少。
