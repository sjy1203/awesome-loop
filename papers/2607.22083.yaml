tldr:
  en: Nanbeige4.2-3B is pretrained from scratch on 28T tokens as a Looped Transformer that reuses its layer stack, then post-trained with SFT and RL; it outperforms larger models including Qwen3.5-9B and Gemma4-12B on agentic benchmarks.
  zh: Nanbeige4.2-3B 采用复用整个层栈的 Looped Transformer，在 28T token 上从头预训练，再经 SFT 和 RL 后训练；在 agentic 基准上超过 Qwen3.5-9B 和 Gemma4-12B 等更大的模型。
