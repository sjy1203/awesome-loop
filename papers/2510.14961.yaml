tldr:
  en: A diffusion forcing sampler for recurrent-depth models decodes new tokens at every forward pass and keeps refining their latent states in parallel through the recurrence; applied to an existing 3.5B recurrent-depth Transformer without any tuning, it gives up to a 5x speedup.
  zh: 为循环深度模型设计的 diffusion forcing 采样器在每次前向时都解码新 token，并通过循环并行地继续细化这些 token 的潜状态；无需任何调参直接用于现有的 3.5B 循环深度 Transformer，最高带来 5x 加速。
