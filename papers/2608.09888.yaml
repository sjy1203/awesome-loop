tldr:
  en: BDH-CQ writes ARC demonstrations into a recurrent memory, then solves the query by iterating one latent update before decoding; a 150M-parameter configuration reaches 29.5% pass@2 on the public ARC-AGI-1 evaluation set at a computed inference cost of $0.0007 per task.
  zh: BDH-CQ 先把 ARC 示例写入循环记忆，再反复迭代同一个潜空间更新来求解查询并解码输出；150M 参数的配置在公开的 ARC-AGI-1 评测集上达到 29.5% pass@2，推算的推理成本为每个任务 $0.0007。
