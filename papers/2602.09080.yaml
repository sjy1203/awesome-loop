tldr:
  en: RecursiveVLM loops a multimodal model's LLM backbone, adding a Recursive Connector that fuses intermediate-layer states per modality and a Monotonic Recursion Loss; it gains +3% over standard Transformers and +7% over vanilla recursive baselines.
  zh: RecursiveVLM 循环多模态模型的 LLM 主干，加入按模态融合中间层状态的 Recursive Connector 和 Monotonic Recursion Loss；相比标准 Transformer 提升 +3%，相比普通递归基线提升 +7%。
