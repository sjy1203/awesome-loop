tldr:
  en: Tests whether looping lets Ouro close the gap between internal representations and verbal outputs; more loops narrow it partly because representational knowledge degrades, and injected concepts are perceived only in the final loop.
  zh: 检验循环能否让 Ouro 弥合内部表示与语言输出之间的差距；循环次数增加会缩小差距，但部分原因是表示中承载的知识在退化，且模型只在最后一遍循环中才能感知注入的概念。
