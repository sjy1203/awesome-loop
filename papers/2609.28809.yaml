tldr:
  en: SRM, an HRM variant built for interpretability, recursively refines multiple latent streams with a weight-tied layer function and learned stream-wise attention; on OpenWebText SRM-base reaches training loss 3.18 with 68M parameters at 7 times the compute time, versus 3.20 for a 124M GPT-2.
  zh: SRM 是为可解释性设计的 HRM 变体，用权重共享的层函数和可学习的 stream-wise attention 递归精炼多条潜在流；在 OpenWebText 上，68M 参数的 SRM-base 以 7 倍计算时间达到 3.18 的训练损失，124M 参数的 GPT-2 为 3.20。
