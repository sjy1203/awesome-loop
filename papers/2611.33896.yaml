id: "2611.33896"
tier: radar
title: "Looped Models are Fast Multi-Token Predictors"
date: "2026-11-25"
venue: arXiv
authors: [Ayhan Suleymanzade, Sean McLeish, Sehoon Kim, Jinwoo Kim, Antoine Bosselut]
links:
  paper: https://arxiv.org/abs/2611.33896
  code: https://github.com/MisakiTaro0414/floodgates
category: systems
focus: core
facets:
  kv: per-pass
tldr:
  en: Floodgates trains LoRA adapters, active only while drafting, so that one loop of a looped LM reads the final-loop KV cache of earlier tokens and drafts a block of mask tokens in parallel for lossless full-depth verification; at batch size one it decodes up to 7.5× faster than plain decoding.
  zh: Floodgates 训练只在起草时启用的 LoRA adapter，让循环 LM 的一遍循环读取先前 token 的末遍 KV cache，并行起草一组 mask token，再由满深度模型无损验证；batch size 为 1 时，解码速度最高可达普通解码的 7.5×。
added: "2026-11-28"
