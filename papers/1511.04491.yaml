tldr:
  en: DRCN applies a single convolutional layer recursively, up to 16 recursions, for image super-resolution, adding depth without new parameters; recursive-supervision and skip-connection ease training, and it outperforms previous methods.
  zh: DRCN 在图像超分辨率中递归应用同一个卷积层（最多 16 次递归），加深网络而不增加参数；递归监督和跳跃连接缓解了训练困难，效果超过以往方法。
