tldr:
  en: Training-free dynamic routing fits programs that skip layers or repeat blocks of a frozen LLM's layers from 3 or 10 demonstrations, with the model's confidence arbitrating; it gains on average over MMLU's 49 tasks, doubles a 7B model's ARC-AGI accuracy where its CoT fails, and complements CoT.
  zh: 无需训练的动态路由从 3 或 10 个示例中为冻结的 LLM 拟合跳过某些层或重复若干层块的执行程序，并由模型自身的置信度仲裁；它在 MMLU 的 49 个任务上平均带来提升，在 CoT 失效的 ARC-AGI 上让一个 7B 模型的准确率翻倍，并与 CoT 互补。
