tldr:
  en: MoRE shares MoE expert pools across groups of adjacent layers, keeping per-layer routers and a learnable depth embedding before routing; at 114M-1.15B parameters it gets lower perplexity and stronger downstream results than standard MoEs and weight-sharing architectures at matched compute and parameters.
  zh: MoRE 让相邻层组共享 MoE 专家池，每层保留自己的 router，并在路由前加入可学习的深度嵌入；在 114M-1.15B 参数规模上，它在计算量和参数量相同的条件下，比标准 MoE 和最先进的权重共享架构困惑度更低、下游表现更强。
