tldr:
  en: MoEUT is a shared-layer Transformer with mixture-of-experts feedforward and attention layers, layer grouping and peri-layernorm; it slightly outperforms standard Transformers on language modeling tasks such as BLiMP and PIQA using less compute and memory.
  zh: MoEUT 是在前馈层和注意力层都使用 MoE 的共享层 Transformer，并采用层分组和 peri-layernorm 方案；它在 BLiMP、PIQA 等语言建模任务上略优于标准 Transformer，同时计算和内存更少。
