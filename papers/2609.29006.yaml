tldr:
  en: FluidRain reuses one rain-flow-guided block stack across three scales, each output becoming the next scale's state, and one attention operator across three frames (Loop-in-Loop); the 0.80M-parameter video derainer stays competitive with substantially larger restoration models on four benchmarks.
  zh: FluidRain 在三个尺度上复用同一组由雨流引导的块（每个尺度的输出作为下一尺度的状态），并在三帧之间复用同一个注意力算子（Loop-in-Loop）；这个仅 0.80M 参数的视频去雨模型在四个基准上与大得多的复原模型相当。
