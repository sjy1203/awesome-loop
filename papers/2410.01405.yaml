tldr:
  en: Derives approximation rates for looped Transformers, revealing a limitation specific to looping, and adds per-loop scaling parameters conditioned on timestep encoding; in experiments more loops improve performance and timestep encoding adds further gains.
  zh: 推导循环 Transformer 的逼近速率，揭示循环结构特有的局限，并据此加入以时间步编码为条件的每遍缩放参数；实验中循环次数越多效果越好，时间步编码带来进一步提升。
