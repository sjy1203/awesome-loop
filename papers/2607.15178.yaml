tldr:
  en: T2MLR fuses a middle-layer state cached from the previous token into an earlier layer at the current token; it beats data- and parameter-matched Transformers, and recurrence over a middle block often beats full-layer recurrence.
  zh: T2MLR 把上一个 token 缓存的中间层表示融合进当前 token 的较早层；它优于数据和参数匹配的 Transformer 基线，而且只在中间一段层上做循环往往优于全层循环。
