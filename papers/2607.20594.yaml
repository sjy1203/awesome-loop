tldr:
  en: Trains weight-tied looped transformers on group word problems; training installs a serial frontier that solves about n_train/T_train positions per loop, and weight tying, not expressivity, selects it over the parallel scans untied models learn.
  zh: 在群的字问题（group word problem）上训练权重共享的循环 Transformer；训练会形成每遍约求解 n_train/T_train 个位置的串行前沿，选出这种算法的是权重共享这一结构先验而不是表达能力，未共享权重的标准深度 Transformer 则学到并行扫描。
