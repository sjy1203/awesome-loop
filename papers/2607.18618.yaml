tldr:
  en: LatentMT trains per-language-pair LoRA adapters on a frozen 2.6B-parameter looped LM (Ouro-2.6B-Thinking) run at a fixed number of recurrent steps; across 32 translation directions it matches models three to five times larger, and gains from more steps saturate after the early steps.
  zh: LatentMT 在冻结的 2.6B 参数循环语言模型（Ouro-2.6B-Thinking）上为每个语言对训练 LoRA adapter，并固定循环步数；在 32 个翻译方向上，它的表现与大三到五倍的模型相当，增加循环步数的收益在前几步之后很快饱和。
