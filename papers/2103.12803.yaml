tldr:
  en: JFB trains implicit networks, which infer by solving a fixed-point equation, by omitting the Jacobian term from backpropagation, keeping training memory fixed; on MNIST, SVHN and CIFAR-10 they are competitive with feedforward and prior implicit networks of the same parameter count.
  zh: JFB 训练通过求解不动点方程进行推理的隐式网络，在反向传播中省略 Jacobian 项，使训练内存保持固定；在 MNIST、SVHN 和 CIFAR-10 上，这些隐式网络与参数量相同的前馈网络和已有隐式网络表现相当。
