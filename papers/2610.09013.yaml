title: "Enabling Dynamic Computation in Looped LMs"
date: "2026-10-06"
venue: arXiv
authors: [Aayush Mishra, Arnau Padrés Masdemont, Victor Conchello Vendrell, Jordi Ros Giralt, Arash Behboodi, Fabio Valerio Massoli]
links:
  paper: https://arxiv.org/abs/2610.09013
category: systems
focus: core
facets:
  placement: whole-stack
  depth_train: adaptive
  kv: per-pass
tldr:
  en: Ragged KV, a best-available KV cache, lets early-exiting tokens in Ouro-style looped LMs stop computing by aliasing deeper KV entries to their exit-depth cache, cutting FLOPs and KV memory by up to 30% at full-depth performance; a corrected early-exit prior makes tokens exit at heterogeneous depths.
  zh: Ragged KV 是一种“最佳可用”KV 缓存策略：提前退出的 token 不再继续计算，更深循环所需的 KV 条目直接复用其退出深度的缓存，在 Ouro 类循环语言模型上把 FLOPs 和 KV 内存最多减少 30%，同时保持全深度性能；修正早退先验的施加方式后，token 会按难度在不同深度退出。
added: "2026-11-24"
