tldr:
  en: Uses Universal Transformers with adaptive computation time halting as encoder and decoder of a semantic communication system; it reports higher BLEU and lower symbol error ratio than a fixed-depth Transformer system on noisy channels.
  zh: 把带自适应计算时间（ACT）停止机制的 Universal Transformer 用作语义通信系统的编码器和解码器；在有噪声的信道上，它的 BLEU 高于固定深度的 Transformer 系统，符号错误率也更低。
