loop:
  segments:
    - {role: prelude, layers: "?", label: earlier layers}
    - role: core
      layers: 28
      label: 28 shared layers
      passes: {train: "2", test: "2"}
    - {role: coda, layers: "?", label: later layers}
  note:
    en: GLM-5.4 loops 28 layers of the GLM-5 base model for two iterations; the post describes them as middle layers but does not give the base model's layer count or which 28 layers are looped. The loop was added to the already pre-trained base through continued training at the 750B scale.
    zh: GLM-5.4 把 GLM-5 基座的 28 层循环两遍；文中说这些是中间层，但没有给出基座的总层数，也没说具体是哪 28 层。循环是在已经预训练好的 750B 规模基座上通过继续训练加进去的。
budget:
  baseline:
    en: A 30B model with the same architecture as the 750B base, without the loop, evaluated after 200K long-context SFT with thinking mode enabled.
    zh: 与 750B 基座同架构、不循环的 30B 模型，在 200K 长上下文 SFT 之后开启 thinking 模式评测。
  matched: [params]
  not_matched: [flops]
  baseline_tuned: unknown
  headline:
    en: With identical parameter counts and about 10% more total training compute, the looped 30B model improves AIME25 from 19.17 to 30.42 and GPQA-Diamond from 47.58 to 56.26, while average output length drops by 10-14% on most benchmarks.
    zh: 参数量相同、总训练算力只多约 10% 时，循环版 30B 模型的 AIME25 从 19.17 升到 30.42，GPQA-Diamond 从 47.58 升到 56.26；多数基准上的平均输出长度缩短 10-14%。
  ref: Scaling Correctness & Controlled Iso-Parameter Ablations (results table)
results:
  - setting: 30B, same architecture as the 750B base, iso-parameter, about 10% more total training compute; after 200K long-context SFT, thinking mode on
    metric: score, baseline / + Loop
    values:
      AIME25: "19.17 / 30.42"
      GPQA-Diamond: "47.58 / 56.26"
      AA-LCR: "40.33 / 47.67"
      MMLU-Pro: "71.65 / 75.05"
      IFBench: "50.20 / 53.47"
