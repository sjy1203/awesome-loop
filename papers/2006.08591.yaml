tldr:
  en: Introduces monDEQ, an implicit-depth model built on monotone operator theory whose parameterization guarantees a unique equilibrium, solved with operator-splitting methods that converge stably; it outperforms Neural ODE-based models while being more computationally efficient.
  zh: 提出 monDEQ，一种基于单调算子理论的隐式深度模型，其参数化保证唯一平衡点存在，并用稳定收敛的算子分裂方法求解；它优于基于 Neural ODE 的模型，且计算效率更高。
