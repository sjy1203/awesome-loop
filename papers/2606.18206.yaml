tldr:
  en: FPRM stabilizes deep looped Transformers with pre-norm layers and residual scaling and halts when the hidden state reaches a fixed point, adapting compute to task difficulty; it is effective on Sudoku, Maze, state-tracking and ARC-AGI.
  zh: FPRM 用 pre-norm 层和残差缩放稳定深层循环 Transformer，并在隐藏状态到达不动点时停止，使算力随任务难度变化；在 Sudoku、Maze、状态追踪和 ARC-AGI 上有效。
