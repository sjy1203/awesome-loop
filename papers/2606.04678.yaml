tldr:
  en: LARM loops a shared Transformer block as an ASR acoustic encoder, adding sparse CTC checkpoints, supervision-clock embeddings, FiLM depth conditioning and delayed soft-posterior feedback; on LibriSpeech it improves WER as inference loops increase and is competitive with deeper unshared-parameter baselines.
  zh: LARM 把共享的 Transformer 块循环用作 ASR 声学编码器，并加入稀疏 CTC 检查点、监督时钟嵌入、FiLM 深度调制和延迟软后验反馈；在 LibriSpeech 上，WER 随推理循环次数增加而改善，性能与更深的不共享参数基线相当。
