tldr:
  en: Five interpretability lenses on eight looped LMs from four families show carry-loop models (Ouro, LoopUS) predict best within their training depth and lose answers, language or refusals under noise, while re-read-loop models (Parcae, Rec-OLMo, Huginn) improve or plateau with more iterations and are unaffected by noise.
  zh: 研究用五种机制可解释性视角考察四个系列的八个循环语言模型，发现 carry loop 模型（Ouro、LoopUS）在训练深度内预测最好，注入噪声后会丢失答案、语言能力或拒答对齐，而 re-read loop 模型（Parcae、Rec-OLMo、Huginn）随迭代增多而提升或持平，且不受噪声影响。
