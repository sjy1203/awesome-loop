tldr:
  en: Fits a joint scaling law over an iso-depth pretraining sweep of looped language models and measures a recurrence-equivalence exponent of 0.46, so replacing unique blocks with shared recurrences raises validation loss at matched training compute.
  zh: 在循环语言模型的等深度预训练扫描上拟合联合 scaling law，测得 recurrence-equivalence 指数为 0.46，说明在训练算力匹配时用共享的循环替换独立块会提高验证损失。
