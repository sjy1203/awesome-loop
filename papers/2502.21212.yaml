tldr:
  en: Proves that with CoT a one-layer linear Transformer learns multi-step gradient descent in context, but without CoT only one step; the same technique shows looped Transformers reach strictly lower asymptotic loss than a non-looped one-layer Transformer on in-context linear regression when L≥2.
  zh: 证明借助 CoT，单层线性 Transformer 能在上下文中学会多步梯度下降，不用 CoT 时只能执行一步；用同样的技术还证明，在上下文线性回归中，当 L≥2 时循环 Transformer 的渐近损失严格低于不循环的单层 Transformer。
