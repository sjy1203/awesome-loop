title: "Loopback Transformer: Towards a Unified View of Residual Looped Transformers"
date: "2026-11-04"
venue: arXiv
authors: [Xuan Ouyang, Zefan Cai, Chenlong Zhang, Cheng Luo, Ke Wan, Junjie Hu]
links:
  paper: https://arxiv.org/abs/2611.07226
  code: https://github.com/yancyou/Loopback
category: architecture/state
tldr:
  en: Loopback Transformer reads each shared-block update separately, using geometric decay for total update weight and attention to allocate it; it reaches lower validation loss than standard Transformers with 40-75% of their Transformer parameters.
  zh: Loopback Transformer 把共享块每次的更新量单独读出，用几何衰减设定更新总权重、用注意力分配权重；它用标准 Transformer 40-75% 的 Transformer 参数达到更低的验证损失。
