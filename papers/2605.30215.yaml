tldr:
  en: DéjàView applies a single looped transformer block to per-view features for K refinement steps in multi-view 3D reconstruction; it matches or beats much larger feed-forward models on five benchmarks and beats an untied per-step variant.
  zh: DéjàView 在多视角 3D 重建中把同一个循环 transformer block 在每个视角的特征上应用 K 步精炼；在五个基准上达到或超过大得多的前馈模型，也优于每步参数独立的变体。
