tldr:
  en: ERM uses Hopfield-type memories of valid local and global structures to assign energies to a recursive model's candidate trajectories, which guide selection and suggest an effective recurrent depth; it reaches 98.97% on Sudoku, 88.04% on PPBench and 99.30% on Maze, and cuts RedPajama-V2 perplexity by 1.74%.
  zh: ERM 用记录有效局部与全局结构的 Hopfield 型记忆为递归模型的候选轨迹赋予能量，用来选择候选并给出有效的递归深度范围；在 Sudoku 上达到 98.97%，PPBench 上达到 88.04%，Maze 上达到 99.30%，并把 RedPajama-V2 困惑度降低 1.74%。
