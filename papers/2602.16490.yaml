tldr:
  en: Looped and depth-grown (middle-layer duplication) LLMs share depth-wise signatures of iterative computation; looping a middle block of a depth-grown model at inference, without loop training, raises accuracy on some reasoning primitives by up to 2x.
  zh: 循环模型与深度生长（复制中间层）得到的 LLM 具有共同的逐层迭代计算特征；在推理时对未经循环训练的深度生长模型循环其中间块，可使部分推理基元的准确率最多提升到 2 倍。
