tldr:
  en: Shows that a k-layer transformer looped L times nearly matches a kL-layer model on synthetic reasoning and is competitive on language-model reasoning tasks, and proves T loops can simulate T steps of CoT.
  zh: 表明 k 层 Transformer 循环 L 次在合成推理任务上接近 kL 层模型，在语言模型的下游推理任务上也能与之竞争，并证明 T 次循环可以模拟 T 步 CoT。
