tldr:
  en: Step-Decomposed Influence (SDI) unrolls a looped Transformer to split TracIn data attribution into per-iteration influence scores, using TensorSketch so per-example gradients are never materialised; on looped GPT-style models and algorithmic tasks it matches full-gradient baselines with low error.
  zh: Step-Decomposed Influence（SDI）展开循环 Transformer 的循环计算，把 TracIn 数据归因拆成每次循环迭代各自的影响分数，并用不显式生成逐样本梯度的 TensorSketch 实现；在循环 GPT 式模型和算法任务上，它与全梯度基线结果一致且误差很低。
