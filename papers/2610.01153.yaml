tldr:
  en: LOOM loops a whole MoE decoder with residual scaling, input-embedding re-injection every loop, per-loop routers over shared experts and a Looping Residual; under near-iso-FLOP the 700M model performs best at 5 loops, cutting perplexity from 18.36 to 16.54 over the non-looped baseline.
  zh: LOOM 循环整个 MoE 解码器，并采用残差缩放、每次循环重新注入输入嵌入、在共享专家之上为每次循环配独立路由器，以及 Looping Residual；在接近等 FLOPs 的条件下，700M 模型在 5 次循环时表现最好，相对不循环基线把困惑度从 18.36 降到 16.54。
