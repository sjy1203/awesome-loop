tldr:
  en: WISE, training-free, uses full attention in early recurrent steps of a recurrent-depth LM to find a block-sparse working set and reuses that support later; it largely preserves full-attention multi-hop QA performance, with up to a 1.76x late-step attention speedup over native FlashAttention at 4K context.
  zh: WISE 无需训练：在循环深度语言模型的前几个循环步中用完整注意力找出块稀疏的工作集，之后的循环步复用这一注意力支撑；它在多跳 QA 上基本保持完整注意力的性能，并在 4K 上下文下使后期步注意力比原生 FlashAttention 最多快 1.76x。
