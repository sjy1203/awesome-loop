tldr:
  en: BRST reuses one Transformer block 12 times in the encoder and one 6 times in the decoder of a CTC-attention speech recognizer, adding a small adapter module (ADM) after each reuse; on AISHELL-1 it reaches 9.3%/6.63% CER with 7.6M/8.3M parameters without/with the ADM.
  zh: BRST 在 CTC-attention 语音识别 Transformer 中让编码器的一个块重复 12 次、解码器的一个块重复 6 次，并在每次复用后加入少量参数的适配器模块（ADM）；在 AISHELL-1 上，不加和加 ADM 时分别以 7.6M/8.3M 参数取得 9.3%/6.63% 的 CER。
