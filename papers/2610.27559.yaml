tldr:
  en: Jointly fine-tunes recurrent-depth LMs (Ouro fixed at four recurrent steps, and HRM-Text-1B) and Qwen3 baselines on 9 clinical NLP datasets; across 13 datasets Ouro-1.4B-Thinking beats Qwen3-1.7B on 11, and Ouro-2.6B-Thinking is competitive with Qwen3-8B on most tasks.
  zh: 在 9 个临床 NLP 数据集上联合微调循环深度语言模型（固定四个循环步的 Ouro，以及 HRM-Text-1B）和 Qwen3 基线；在 13 个数据集中，Ouro-1.4B-Thinking 在 11 个上超过 Qwen3-1.7B，Ouro-2.6B-Thinking 在多数任务上与 Qwen3-8B 相当。
