tldr:
  en: Equilibrium Transformers add a module to every layer that runs proximal gradient descent on a learned energy to refine the hidden state before each token is emitted; on binary cumulative parity they beat standard Transformers by +3.28% on average at challenging lengths, up to +8.07%.
  zh: Equilibrium Transformer 在每一层加入一个模块，对学到的能量函数做近端梯度下降，在输出每个 token 前迭代精炼隐藏状态；在二进制累积奇偶任务的困难长度上，它平均比标准 Transformer 高 +3.28%，最高高出 +8.07%。
