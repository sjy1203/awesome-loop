tldr:
  en: Perceiver repeatedly cross-attends from a small latent array to large inputs, with weights shared across repeats after the first, like an RNN unrolled in depth; it is competitive across images, point clouds, audio and video.
  zh: Perceiver 用一个小的隐变量数组反复对大规模输入做 cross-attention，除第一次外各次重复共享权重，相当于沿深度展开的 RNN；它在图像、点云、音频和视频上都有竞争力。
