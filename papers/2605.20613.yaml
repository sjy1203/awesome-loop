tldr:
  en: HRM-Text pretrains a hierarchical recurrent language model with MagicNorm, warmup deep credit assignment and a task-completion objective on instruction-response pairs; a 1B model on 40 billion unique tokens performs competitively with 2-7B open models.
  zh: HRM-Text 用 MagicNorm、warmup deep credit assignment 和基于指令-回复对的任务完成目标预训练分层循环语言模型；在 40 billion 个不重复 token 上训练的 1B 模型与 2-7B 参数的开源模型表现相当。
