tldr:
  en: Shows that a looped 13-layer transformer with programmed weights, reading instructions and memory from its input, emulates a small instruction-set computer and runs a calculator, linear algebra routines and in-context learning algorithms.
  zh: 证明一个权重经过编程设定的循环 13 层 transformer 能从输入中读取指令和内存，模拟一台小型指令集计算机，并运行计算器、线性代数例程和 in-context learning 算法。
