tldr:
  en: TaH2 post-trains a looped Qwen3 backbone jointly with a token-level iteration decider supervised by online lookahead depth labels, so only tokens that benefit get extra iterations; on AIME it raises the accuracy-compute slope by 53% (2.74 vs. 1.79) over the non-looped baseline.
  zh: TaH2 对循环的 Qwen3 骨干和 token 级迭代决策器进行联合后训练，决策器由在线前瞻深度标签监督，只让受益的 token 获得额外迭代；在 AIME 上，它相对非循环基线把准确率-计算斜率提高 53%（2.74 vs. 1.79）。
