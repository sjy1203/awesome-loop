tldr:
  en: Compares depth-wise Universal Transformer recurrence with chunk-wise Temporal Latent Bottleneck recurrence and proposes GUT, a gated UT with global mean-based dynamic halting; GUT generally beats UT on ListOps and Logical Inference, while chunk-wise recurrence is more robust in flip-flop LM and length generalization.
  zh: 比较 Universal Transformer 的深度循环与 Temporal Latent Bottleneck 的分块时间循环，并提出带全局均值动态停止机制的门控 UT（GUT）；GUT 在 ListOps 和 Logical Inference 上总体优于 UT，而分块循环在 flip-flop 语言建模和长度泛化上更稳健。
