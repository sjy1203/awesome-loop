tldr:
  en: SCORE replaces stacked layers with one shared block applied for a fixed number of steps through the contractive update ht+1 = (1 - dt) * ht + dt * F(ht); on GNNs for ESOL, MLPs and nanoGPT it generally speeds convergence while cutting parameters, and simple Euler steps give the best cost trade-off.
  zh: SCORE 用一个共享块按固定步数迭代取代逐层堆叠，采用收缩式更新 ht+1 = (1 - dt) * ht + dt * F(ht)；在 ESOL 上的 GNN、MLP 和 nanoGPT 中，它通常加快收敛并减少参数，简单的 Euler 积分在计算成本与性能之间折中最好。
