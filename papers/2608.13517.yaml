tldr:
  en: Mimir is a 1.78B HRM-Text model whose low- and high-level stacks are applied repeatedly in an interleaved schedule, trained from scratch on 161 permissible datasets; across 20 benchmarks Mimir v1.5 has the best average of all sub-2B models in every domain, beating HRM-Text 1B, Ouro 1.4B and Ouro 2.6B.
  zh: Mimir 是基于 HRM-Text 的 1.78B 模型，其低层栈和高层栈按交错顺序重复应用，并在 161 个符合许可要求的数据集上从头训练；在 20 个基准上，Mimir v1.5 在每个领域的平均分都是所有 2B 以下模型中最高的，超过 HRM-Text 1B、Ouro 1.4B 和 Ouro 2.6B。
