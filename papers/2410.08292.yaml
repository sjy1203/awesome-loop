  depth_train: fixed
  kv: n/a
tldr:
  en: Proves that for in-context linear regression, the global minimizer of a linear looped Transformer's training loss implements multi-step preconditioned gradient descent, and that gradient flow converges fast despite non-convexity; synthetic experiments agree.
  zh: 证明在 in-context 线性回归中，线性循环 Transformer 总体训练损失的全局最小点实现了多步预条件梯度下降，且尽管损失非凸，梯度流仍能快速收敛；合成实验与理论一致。
