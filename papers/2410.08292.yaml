title: "Can Looped Transformers Learn to Implement Multi-step Gradient Descent for In-context Learning?"
date: "2024-10-10"
venue: arXiv
authors: [Khashayar Gatmiry, Nikunj Saunshi, Sashank J. Reddi, Stefanie Jegelka, Sanjiv Kumar]
