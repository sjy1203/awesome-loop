tldr:
  en: Neural Data Router adds a copy gate, which lets a column skip a step, and geometric attention to a Transformer with shared layer weights; it reaches 100% length generalization accuracy on compositional table lookup and near-perfect accuracy on simple arithmetic and a ListOps variant.
  zh: Neural Data Router 在层间共享权重的 Transformer 中加入可让某列跳过一步的 copy gate 和几何注意力（geometric attention）；它在组合查表任务上达到 100% 的长度泛化准确率，在简单算术任务和一个 ListOps 变体上准确率接近完美。
