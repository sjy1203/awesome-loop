loop:
  segments:
    - role: core
      layers: 24
      label: "whole stack (2.6B: 48 layers)"
      passes: {train: "8 in Stage 1a, then 4", test: "4 by default; the exit gate can stop earlier"}
  note:
    en: >-
      The whole decoder stack loops: Ouro 1.4B repeats its 24 layers and Ouro 2.6B its 48 layers, which were upcycled
      from the 24 layers by layer duplication; embedding and LM head sit outside the loop. The embedding enters only
      before the first step, and each step takes the previous step's output. After every step an LM head and an exit
      gate read the hidden state. Training always runs T_max steps and weights each step's loss by the learned exit
      distribution. Each step keeps its own KV cache.
    zh: >-
      整个 decoder 层栈循环：Ouro 1.4B 重复全部 24 层，Ouro 2.6B 重复 48 层（由这 24 层复制 upcycle 而来）；embedding 和 LM head 在循环外。embedding 只在第一步之前输入，之后每一步接上一步的输出。每一步之后由 LM head 和退出门读取隐状态。训练时总是跑满 T_max 步，按学到的退出分布给各步 loss 加权。每一步各存一份 KV。
budget:
  baseline:
    en: >-
      Public dense base models run through the same evaluation pipeline (Gemma3, Llama3.1/3.2, Qwen2.5 and Qwen3, 1B to
      12B); the Thinking models are compared with Qwen3 and DeepSeek-Distill-Qwen.
    zh: 用同一评测流程测试的公开 dense 基座模型（Gemma3、Llama3.1/3.2、Qwen2.5、Qwen3，1B 到 12B）；Thinking 模型对比 Qwen3 和 DeepSeek-Distill-Qwen。
  matched: []
  not_matched: [params, tokens]
  baseline_tuned: unknown
  headline:
    en: >-
      Ouro 1.4B R4 (7.7T tokens) matches or beats the 4B Qwen3-Base (36T tokens) on BBH (71.02 vs 70.95), GSM8K (78.92
      vs 72.86) and MATH500 (82.40 vs 59.60); Ouro 2.6B R4 scores 55.73 on MMLU-Pro, 80.46 on BBH and 90.85 on MATH500,
      against 53.72, 77.65 and 62.30 for the 8B Qwen3-Base.
    zh: >-
      Ouro 1.4B R4（7.7T token）在 BBH（71.02 对 70.95）、GSM8K（78.92 对 72.86）和 MATH500（82.40 对 59.60）上持平或超过 4B 的 Qwen3-Base（36T token）；Ouro 2.6B R4 的 MMLU-Pro、BBH、MATH500 分别为 55.73、80.46、90.85，8B 的 Qwen3-Base 为 53.72、77.65、62.30。
  ref: Section 5.1; Tables 7-8
