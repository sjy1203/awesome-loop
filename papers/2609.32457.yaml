tldr:
  en: ReFlux trains a sparse router over a frozen Transformer that writes depth increments Δ back to earlier layers, in a second traversal of the same token or streamed to the next token; it lowers perplexity on ten corpora and raises accuracy by 2.1-2.3 points, reaching 4.7 on multi-hop reasoning.
  zh: ReFlux 在冻结的 Transformer 上训练稀疏路由器，把深度增量 Δ 写回较早的层，可用于同一 token 的第二遍遍历，也可流式传给下一个 token；它在十个语料上降低困惑度，准确率提高 2.1-2.3 个点，多跳推理上最高提高 4.7 个点。
