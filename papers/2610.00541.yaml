tldr:
  en: RRM keeps a pool of L learned layers and, at each of T recursive steps, samples one layer with replacement per example; on reasoning tasks including Sudoku, Maze-Hard and ARC-AGI-1 it matches or exceeds baselines, often with 50-75% fewer parameters, and can run deeper at inference than in training.
  zh: RRM 维护一个由 L 个学习层组成的层池，在 T 个递归步中每一步为每个样本有放回地随机抽取一层；在 Sudoku、Maze-Hard 和 ARC-AGI-1 等推理任务上，它达到或超过基线，参数常常少 50-75%，推理时还能运行比训练时更深的递归。
