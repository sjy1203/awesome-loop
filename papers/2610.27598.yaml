tldr:
  en: Meta Experts are MoE experts shared by all layers instead of private to one layer; they lower cross-entropy loss and raise downstream accuracy, and with activated experts and expert granularity fixed the model matches Vanilla MoE using only 70-80% of the experts.
  zh: Meta Expert 是被所有层共享、而非某一层私有的 MoE 专家；它降低了交叉熵损失、提高了下游准确率，在激活专家数和专家粒度不变时，只用 70-80% 的专家就达到 Vanilla MoE 的性能。
