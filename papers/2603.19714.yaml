tldr:
  en: LoopRPT brings reinforcement pre-training to looped LMs, rewarding each latent loop step against an EMA teacher via noisy latent rollouts and training the exit policy; on Ouro-2.6B it boosts Hard Peak next-token reasoning accuracy by +3.58 while reducing average steps from 3.51 to 2.28.
  zh: LoopRPT 为循环语言模型引入强化预训练，借助 EMA teacher 和带噪声的 latent rollout 为每个潜在循环步分配奖励并训练退出策略；在 Ouro-2.6B 上，它把 Hard Peak 下一 token 推理准确率提高 +3.58，同时把平均步数从 3.51 降到 2.28。
