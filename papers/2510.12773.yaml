tldr:
  en: Dr.LLM equips a frozen pretrained LLM with lightweight per-layer routers that skip, execute, or repeat each block, trained on MCTS-derived layer configurations; on ARC and DART it improves accuracy by up to +3.4%p while saving 5 layers per example on average.
  zh: Dr.LLM 为冻结的预训练 LLM 的每一层配备轻量路由器，决定跳过、执行还是重复该块，路由器用 MCTS 搜得的层配置训练；在 ARC 和 DART 上，它把准确率最多提高 +3.4%p，同时平均每个样本少执行 5 层。
