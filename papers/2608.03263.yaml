tldr:
  en: "Regrowing a published 30M-parameter recurrent-depth reasoner shows its compositional ignition is real and sits at the readout: arrival time rises with problem depth, the decision margin jumps 5.8-8.0 logits in one iteration at commitment, and intermediates never surface through the tied readout."
  zh: 从头重新训练一个已发表的 30M 参数循环深度推理模型，发现其组合式“点火”真实存在且发生在读出端：到达时间随问题深度上升，提交答案时决策 margin 在一次迭代内跳升 5.8-8.0 logits，而中间结果始终无法通过与 embedding 绑定的读出层恢复。
