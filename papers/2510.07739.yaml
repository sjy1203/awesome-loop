tldr:
  en: MeSH gives recursive Transformers an explicit memory buffer and lightweight routers that vary computation across iterations; on Pythia (160M-6.9B) it beats recursive baselines, and at 1.4B it tops the larger non-recursive model by +1.06% average downstream accuracy with 33% fewer non-embedding parameters.
  zh: MeSH 把循环 Transformer 的状态管理外置到显式记忆缓冲区，并用轻量路由器让各次迭代的计算有所区分；在 Pythia（160M-6.9B）上它稳定优于循环基线，在 1.4B 规模上以少 33% 的非 embedding 参数超过更大的非循环模型，平均下游准确率提高 +1.06%。
