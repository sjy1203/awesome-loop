tldr:
  en: FlashLoop, a training-free inference framework, cuts cross-loop redundancy in looped Transformers with token-sparse updates, sparse attention and KV-residual quantization, giving up to 1.64x speedup and 6x less KV-cache memory while largely preserving accuracy.
  zh: FlashLoop 是一个无需训练的推理框架，通过 token 稀疏更新、稀疏注意力和 KV 残差量化减少循环 Transformer 的跨遍冗余，在基本保持精度的同时带来最高 1.64x 的加速和 6x 的 KV 缓存内存降低。
