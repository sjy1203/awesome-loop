  en: Metis-1.6 technical report on Praxis and Logos, two from-scratch models that run a hybrid Mamba-2 and attention MoE stack twice per token; Logos averages 52.93 across 40 post-trained benchmarks, and the report documents training failures.
  zh: Metis-1.6 技术报告介绍从头训练的 Praxis 和 Logos 两个模型，它们对每个 token 将 Mamba-2 与注意力混合的 MoE 堆栈运行两遍；Logos 在 40 个后训练基准上平均 52.93 分，报告还记录了训练中的失败。
