tldr:
  en: Proves by construction that a looped transformer with extra graph-reading attention heads simulates BFS, DFS, Dijkstra and Kosaraju's algorithm with parameters independent of graph size, within finite-precision limits, and is Turing complete at constant width.
  zh: 通过构造证明，带额外读图注意力头的循环 Transformer 能以与图大小无关的参数量模拟 BFS、DFS、Dijkstra 和 Kosaraju 算法，但受有限精度限制，并且在常数宽度下图灵完备。
