tldr:
  en: Tests latent feedback, which feeds each token's top-layer state into the next token's input, against compute-matched multi-epoch Transformers; it saves at most 48% of the compute and 47% of the unique data.
  zh: 把每个 token 的顶层状态送入下一个 token 输入的 latent feedback，与用同等算力多训几个 epoch 的 Transformer 对比；latent feedback 最多省下 48% 的算力和 47% 的不重复数据。
