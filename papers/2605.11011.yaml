tldr:
  en: LoopUS splits a pretrained LLM into encoder, looped reasoning block and decoder, adding a selective gate, random deep supervision and a confidence head for early exit; this improves reasoning-oriented performance without recurrent training from scratch.
  zh: LoopUS 把预训练 LLM 拆成 encoder、循环的推理块和 decoder，并加入选择性门控、随机深度监督和用于提前退出的置信度头；无需从头训练循环模型即可提升偏推理任务的表现。
