tldr:
  en: Memoir asks whether each variable-depth pondering iteration should rewrite the per-sample fast memory it reads; on associative recall with key interference, read-only pondering beats the coupled arm after 240 steps (0.6557 vs 0.5203 recall, 10 of 12 seeds), and both reach 1.0000 after 960 steps.
  zh: Memoir 研究可变深度的每次 pondering 迭代是否应改写它所读取的逐样本快速记忆；在带键干扰的联想回忆任务上，训练 240 步后只读 pondering 优于耦合写入（回忆率 0.6557 对 0.5203，12 个种子中赢 10 个），训练 960 步后两者都达到 1.0000。
