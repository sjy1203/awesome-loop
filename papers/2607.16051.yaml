tldr:
  en: Loopie comprises two open-source looped MoE Transformers (20B with 2B active, 6B with 0.6B active) that repeat each layer in place; ablations show they outperform vanilla Transformers trained with the same compute budget.
  zh: Loopie 包括两个开源的循环 MoE Transformer（20B 总参数、2B 激活，以及 6B 总参数、0.6B 激活），每一层原地重复执行；消融实验显示它们优于相同训练算力下的 vanilla Transformer 基线。
