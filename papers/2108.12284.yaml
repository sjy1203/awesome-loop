tldr:
  en: Revisits simple configuration choices, including Universal Transformer variants with weights shared across layers; a relative-position Universal Transformer reaches 85% on the PCFG productivity split versus 50% previously reported, and universal variants beat standard ones except on COGS and CFQ MCD 1.
  zh: 重新审视若干简单的配置选择，其中包括跨层共享权重的 Universal Transformer 变体；使用相对位置编码的 Universal Transformer 在 PCFG productivity 划分上达到 85%，此前报告为 50%；除 COGS 和 CFQ MCD 1 外，universal 变体均优于标准 Transformer。
