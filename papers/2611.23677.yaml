tldr:
  en: STRM simplifies TRM to a single uniformly updated state, using jittered-rate exponential moving updates and slow-channel readout; under TRM's data, parameters and compute it gains 3.8 points on Sudoku-Extreme and matches TRM on Maze-Hard.
  zh: STRM 把 TRM 简化为单一状态和统一更新，状态采用训练时速率抖动的指数滑动更新，只从慢速更新的通道读出解；在与 TRM 相同的数据、参数和算力下，Sudoku-Extreme 提高 3.8 分，Maze-Hard 与 TRM 持平。
