tldr:
  en: Reproducing PoLar's skip-or-repeat layer programs for frozen LLMs with MCTS on 6 models, repeating beats skipping and both together beat either, but with a format-fixing prompt the router's top prediction collapses to the standard pass, though its top-5 programs still gain.
  zh: 复现 PoLar：让冻结的 LLM 按每个输入的程序跳过或重复层块，并在 6 个模型上用 MCTS 搜索；重复优于跳过，两者结合优于任一单独操作，但在已固定答案格式的提示下，路由器的首选预测退化为标准前向，不过其前 5 个程序合起来仍有提升。
