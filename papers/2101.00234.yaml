tldr:
  en: Subformer shares parameters across the central layers of generative Transformers, with unshared first and last layers and self-attentive factorized embeddings; it can beat the Transformer on translation, summarization and language modeling with fewer parameters.
  zh: Subformer 在生成式 Transformer 中让中间各层共享参数，首尾两层不共享，并使用自注意力式的分解 embedding；在机器翻译、摘要和语言建模上，它能以更少的参数超过 Transformer。
