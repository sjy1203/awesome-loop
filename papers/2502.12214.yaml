tldr:
  en: Zero Token Transformer keeps the first and last layers out of parameter cycling, loops only the middle layers, and adds per-cycle zero tokens with trainable keys whose attention scores guide each cycle and trigger early exit; under a 6-cycle budget it averages 33.52 versus 32.79 for cycling all layers.
  zh: Zero Token Transformer 让首层和末层不参与参数循环，只循环中间层，并在每次循环中加入带可训练 key 的 zero token，其注意力分数指导每次循环的计算并触发提前退出；在 6 个计算周期的预算下，其平均分为 33.52，循环全部层的基线为 32.79。
