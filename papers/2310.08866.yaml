tldr:
  en: Hyper-UT, a Universal Transformer with per-token ACT, uses hyper-modules to build each layer's weights from a weight-embedding pool shared across layers; it generalizes better to more computation steps on conditional pointer value retrieval and matches ViT on image recognition with over 70% average savings.
  zh: Hyper-UT 在带逐 token ACT 的 Universal Transformer 中加入超网络模块，由跨层共享的权重嵌入池生成每层权重；在条件指针取值（C-PVR）任务上它对更多计算步数泛化得更好，在图像识别上与 ViT 性能相当，平均节省超过 70% 的计算。
