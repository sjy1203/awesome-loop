tldr:
  en: Wavefront Decoding is a training-free self-speculative decoder for looped language models that co-batches shallow drafting and full-depth verification in the same recurrent-block calls, reaching 2.42x speedup on Ouro-2.6B and 3.54x on Huginn-3.5B over autoregressive decoding.
  zh: Wavefront Decoding 是面向循环语言模型的免训练自推测解码方法，在同一次批量循环块调用中同时做浅层起草和全深度验证，相对自回归解码在 Ouro-2.6B 上加速 2.42x、在 Huginn-3.5B 上加速 3.54x。
