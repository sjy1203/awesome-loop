tldr:
  en: DEQ finds the fixed point of a weight-tied layer by root-finding and backpropagates through it implicitly; on language modeling such as WikiText-103 it often beats similar-size models while cutting memory by up to 88%.
  zh: DEQ 通过求根直接求出权重共享层的不动点，并用隐式微分反传；在 WikiText-103 等语言建模任务上，它常常优于参数量相近的模型，内存最多减少 88%。
