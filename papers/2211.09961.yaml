tldr:
  en: In equilibrium models, upward generalization to harder instances with more test-time iterations correlates with path independence (reaching the same fixed point from any initialization); promoting it improves generalization and penalizing it degrades it.
  zh: 在均衡模型中，用更多测试时迭代向更难实例泛化的能力与路径无关性（从任意初始化都收敛到同一不动点）相关；提升路径无关性能改善泛化，惩罚它则会变差。
