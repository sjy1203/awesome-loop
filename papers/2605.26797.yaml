tldr:
  en: LRT feeds the previous token's high-level hidden state into the next token's layers; at matched effective compute it improves BPB and CORE and matches a three-loop Transformer in BPB, with one forward per token.
  zh: LRT 把前一个 token 的高层隐藏状态送入下一个 token 的各层；在等效算力相同时提升 BPB 和 CORE，BPB 与三遍循环 Transformer 持平，且每个 token 仍只需一次前向。
