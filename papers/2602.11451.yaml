tldr:
  en: Trains one looped Transformer for many depths via time and step-size conditioning and a shortcut-consistency loss; it performs well on language modeling and reasoning under tight compute budgets and improves as the budget grows.
  zh: 通过时间与步长条件化和 shortcut-consistency 损失，让同一个循环 Transformer 适配多种深度；它在较紧的计算预算下仍能在语言建模和推理上表现良好，并随预算增加而提升。
