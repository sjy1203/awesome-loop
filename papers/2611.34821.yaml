title: "LoopTitan: What Does Parameter Revisit Buy a Mixture-of-Experts?"
date: "2026-11-25"
venue: arXiv
authors: [Zichen Tian, Yudong Lu, Xuansheng Wu, Na Zou, Xia Hu, Guanchu Wang, Qianru Sun]
links:
  paper: https://arxiv.org/abs/2611.34821
  code: https://github.com/datamllab/LoopTitan
  weights: [https://huggingface.co/NaturalScale/LoopTitan-Looped-1.3B-A0.2B-Muon, https://huggingface.co/NaturalScale/LoopTitan-Looped-1.3B-A0.2B-AdamW, https://huggingface.co/NaturalScale/LoopTitan-Base-1.3B-A0.2B]
