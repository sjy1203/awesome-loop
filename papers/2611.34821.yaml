tldr:
  en: LoopTitan compares a looped MoE that visits its middle layers twice with a non-revisit control that has matched parameters, FLOPs and KV cache and the same computed depth but independent layers; revisit itself changes test loss by +0.7 mBPB under AdamW at 1.3B stored parameters and 5B tokens, within noise, and most of the gain comes from the deeper, narrower network shape.
  zh: LoopTitan 把一个中间层访问两次的循环 MoE，与参数、FLOPs、KV cache 匹配且计算深度相同、但各层参数独立的非复用对照模型比较；在 1.3B 存储参数、5B token、AdamW 下，参数复用本身使测试损失变化 +0.7 mBPB，在噪声范围内，大部分收益来自更深更窄的网络形状。
