tldr:
  en: Compares a ~28M-parameter autoregressive Tiny Recursive Model (TRM-AR) that reuses one two-layer block with parameter- and depth-matched Transformers on Python code generation; it beats the parameter-matched control at roughly 175 times its per-step cost, but the depth-matched model fits and generates better.
  zh: 在 Python 代码生成任务上，比较约 28M 参数、反复使用同一个两层块的自回归 Tiny Recursive Model（TRM-AR）与参数匹配、深度匹配的 Transformer；TRM-AR 优于参数匹配对照，但每步成本约为后者的 175 倍，而深度匹配模型的拟合与生成都更好。
