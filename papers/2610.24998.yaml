tldr:
  en: Block Recursive Transformers split the shared core between independent first and last layers into contiguous blocks and repeat each block before moving to the next; in decoder-only models up to 1.7B parameters this improves validation NLL and downstream accuracy over static recursive sharing baselines.
  zh: Block Recursive Transformers 把首尾独立层之间的共享核心划分为若干连续块，每个块重复执行后再进入下一个块；在最大 1.7B 参数的 decoder-only 模型上，这种方式的验证 NLL 和下游准确率都优于静态递归共享基线。
