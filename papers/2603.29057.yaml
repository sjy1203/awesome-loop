tldr:
  en: LA-Sign reuses a shared encoder-decoder Transformer block recurrently to refine skeleton-based sign representations, regularized by contrastive alignment of skeletal and textual features in adaptive hyperbolic space; it reaches state-of-the-art results on WLASL and MSASL with fewer unique layers.
  zh: LA-Sign 循环复用共享的编码器-解码器 Transformer 块来细化基于骨架的手语表示，并用自适应双曲空间中骨架特征与文本特征的对比对齐来约束这一过程；它在 WLASL 和 MSASL 上用更少的独立层取得最先进结果。
