tldr:
  en: LoopCoder-v2 trains 7B Parallel Loop Transformer coders on 18T tokens; two loops lift SWE-bench Verified from 43.0 (non-looped) to 64.4, but three or more regress as later-loop gains shrink against a roughly fixed position-offset cost.
  zh: LoopCoder-v2 在 18T token 上训练 7B 的 Parallel Loop Transformer 代码模型；两遍循环把 SWE-bench Verified 从不循环时的 43.0 提到 64.4，三遍及以上反而退步，因为后续循环的收益递减，而位置偏移代价大致不变。
