tldr:
  en: A fixed-point analysis of looped transformers proves that models without recall cannot achieve strong input-dependence, while recall with outer normalization yields stable, input-dependent fixed points; small models on chess, sudoku and prefix-sums follow these predictions.
  zh: 对循环 Transformer 的不动点分析证明，没有 recall 的模型无法获得强输入依赖，而 recall 加外层归一化能得到稳定且依赖输入的不动点；在国际象棋、数独和前缀和任务上训练的小模型符合这些预测。
