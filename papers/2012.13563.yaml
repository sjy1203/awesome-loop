tldr:
  en: i-FPN replaces a detector's stacked cross-scale FPN blocks with the fixed point of one weight-shared transformation, solved DEQ-style with a residual-like iteration; on MS COCO it adds +3.4, +3.2, +3.5, +4.2, +3.2 mAP to ResNet-50-FPN RetinaNet, Faster-RCNN, FCOS, ATSS and AutoAssign.
  zh: i-FPN 把检测器中堆叠的跨尺度 FPN 块换成同一个权重共享变换的不动点，按 DEQ 方式求解并采用类残差迭代；在 MS COCO 上，它让基于 ResNet-50-FPN 的 RetinaNet、Faster-RCNN、FCOS、ATSS 和 AutoAssign 分别提升 +3.4、+3.2、+3.5、+4.2、+3.2 mAP。
