title: "Practice Makes Fluent: Learning to Use Earlier Predictions in Looped Models"
date: "2026-11-25"
venue: arXiv
authors: [Minseok seo, Hee-Seon Kim, Changick Kim]
links:
  paper: https://arxiv.org/abs/2611.33722
  project: https://msseok96-cpu.github.io/FLUENT/
category: depth
focus: core
facets:
  depth_train: adaptive
  kv: per-pass
tldr:
  en: "FLUENT trains looped models to exit earlier without labels or rewards: it distills the frozen initial model's final-loop prediction into an early loop, anchors the current final loop to that teacher and retrains the exit gate against a depth cost; on the looped LM Ouro-1.4B, mean selected depth falls from 3.05 to 2.48 with mean accuracy 65.4% against 65.3% for the original model, and it also cuts action-head iterations of the recurrent-depth robot policy RD-VLA."
  zh: "FLUENT 无需标签或奖励即可训练循环模型提前退出：把冻结初始模型最后一个 loop 的预测蒸馏到早期 loop，把当前最后一个 loop 锚定到同一教师，并按深度代价重新训练退出门控；在循环语言模型 Ouro-1.4B 上，平均选择深度从 3.05 降到 2.48，平均准确率为 65.4%（原模型 65.3%），它还减少了循环深度机器人策略 RD-VLA 的 action head 迭代次数。"
added: "2026-11-28"
