  depth_train: adaptive
  kv: per-pass
tldr:
  en: "FLUENT trains looped models to exit earlier without labels or rewards: it distills the frozen initial model's final-loop prediction into early loops, anchors the current final loop to that teacher and retrains the exit gate against a depth cost; tested on Crafter, LIBERO, a real robot and the looped LM Ouro-1.4B, it raises real-robot success from 62.3% to 74.6% while mean time over successful episodes falls from 69 s to 31 s."
  zh: "FLUENT 无需标签或奖励即可训练循环模型提前退出：把冻结初始模型最后一个 loop 的预测蒸馏到早期 loop，把当前最后一个 loop 锚定到同一教师，并按深度代价重新训练退出门控；实验覆盖 Crafter、LIBERO、真机和循环语言模型 Ouro-1.4B，真机上成功率从 62.3% 升到 74.6%，成功回合的平均用时从 69 s 降到 31 s。"
