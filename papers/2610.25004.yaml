tldr:
  en: UpLoop upcycles a pretrained non-looped LLM by looping each selected middle layer locally, with learned hidden-wise gates on the attention and MLP residual writes of later loops; starting from Qwen3-4B Base with SFT, it improves the 20-benchmark average by 6.17% at R=3, past the common two-loop saturation.
  zh: UpLoop 把预训练的非循环 LLM 中选定的中间层各自就地循环，并对后续循环的 attention 和 MLP 残差写入施加按隐藏维度学习的门控；从 Qwen3-4B Base 出发经 SFT 后，R=3 时 20 个基准的平均准确率提升 6.17%，突破了常见的两遍循环饱和。
