tldr:
  en: Compares dense, depth-grown and looped language models up to 3B parameters plus controlled tasks; grown and looped models rely more on context, acquire ICL earlier and retain it more strongly than a full-depth dense reference, and lean more on induction-ranked heads for few-shot performance.
  zh: 在最大 3B 参数的语言模型和受控任务上比较稠密、深度增长和循环模型；与全深度稠密参照相比，增长和循环模型更依赖上下文信息，更早习得 ICL 且保持得更牢，few-shot 表现也更依赖按 induction 排名的注意力头。
