tldr:
  en: LOTUS loops a pretrained LM over padded latent blocks and supervises each latent position with its gold CoT-step token; at 3B scale it closes the gap to explicit CoT while cutting thought-phase latency 2.5x-6.9x.
  zh: LOTUS 让预训练语言模型在填充的 latent 块上循环计算，并用对应 CoT 步骤的 gold token 逐位置监督每个 latent；在 3B 规模上它弥合了与显式 CoT 的差距，同时把思考阶段延迟降低 2.5x-6.9x。
