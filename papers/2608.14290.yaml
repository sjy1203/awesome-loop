tldr:
  en: Mobius-v0 shares one global FFN memory across all layers, queried repeatedly by self-attention reasoners via hidden states; a 7B model trained from scratch matches a 7B Transformer with 62.6% of its training data, and Intern-S2-Mobius (from Qwen3.5-35B) gives nearly 4x end-to-end inference speedup.
  zh: Mobius-v0 让所有层共享一个全局 FFN 记忆，多个 self-attention 推理器通过隐状态反复查询它；从头训练的 7B 模型只用 7B Transformer 基线 62.6% 的训练数据就达到相近的下游得分，从 Qwen3.5-35B 继续预训练的 Intern-S2-Mobius 下游得分相近，端到端推理加速接近 4x。
