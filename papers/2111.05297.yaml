tldr:
  en: SReT shares weights across depth in vision transformers by looping each block; naive recursion gives a ~2% gain, and sliced group self-attention across recursions cuts the added cost by 10~30% with minimal performance loss.
  zh: SReT 通过循环执行每个块在视觉 Transformer 的深度上共享权重；朴素递归带来 ~2% 的提升，跨递归的切片分组自注意力把额外开销降低 10~30%，性能损失很小。
