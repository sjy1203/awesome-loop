tldr:
  en: Trains weight-tied recurrent networks with few iterations on easy prefix-sum, maze and chess problems and shows that running extra iterations at test time lets them solve harder instances.
  zh: 用较少的迭代次数在简单的前缀和、迷宫和国际象棋问题上训练权重共享的循环网络，发现测试时增加迭代次数即可解出更难的实例。
