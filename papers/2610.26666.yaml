tldr:
  en: Adds to HRM, TRM and URM a persistent intermediate state that the same operator updates after repeated fast-state updates, at matched parameter counts; on ARC-AGI-1 under a single-GPU budget, the nested variants show no consistent advantage, and exact solving stays near zero for all configurations.
  zh: 在参数量匹配的条件下，为 HRM、TRM 和 URM 增加一个持久的中间状态，由同一算子在多次快速状态更新之后对其更新；在单 GPU 预算的 ARC-AGI-1 实验中，嵌套变体没有表现出一致优势，所有配置的精确求解率都接近零。
