tldr:
  en: Proves that looped transformers repeating middle layers Θ(log n) times recognize regular languages and solve graph connectivity, which fixed-depth transformers cannot under standard conjectures; growing depth is more efficient than growing width or chain-of-thought steps.
  zh: 证明中间层重复 Θ(log n) 次的循环 transformer 能识别正则语言并求解图连通性，而在标准复杂性猜想下固定深度 transformer 做不到；增加深度比增加宽度或 chain-of-thought 步数更高效。
