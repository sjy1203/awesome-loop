tldr:
  en: RTM swaps the single-pass MLP mapping network of style-based generators for a TRM-style shared block iterated in nested refinement cycles; with IMLE it reaches the highest precision and recall among current state-of-the-art approaches at competitive FID, and it also improves StyleGAN2 and StyleGAN2-ADA.
  zh: RTM 把风格生成器中单次前向的 MLP 映射网络换成 TRM 式共享块，在嵌套的细化循环中迭代；结合 IMLE 时，它在 FID 保持竞争力的同时取得当前最先进方法中最高的 precision 和 recall，也能提升 StyleGAN2 和 StyleGAN2-ADA。
