title: "ResidualQuant: KV Cache Quantization for Looped Transformers with 2-Bit Residuals"
date: "2026-10-07"
venue: arXiv
authors: [Heejun Kim, Junyoung Lee, SangLyul Cho, Dongsu Han, Insu Han, Sehoon Kim]
