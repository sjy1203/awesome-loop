name: discover
on:
  schedule:
    - cron: "30 2 * * *"  # daily 02:30 UTC
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: data-update
  cancel-in-progress: false
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml jsonschema
      # Queues new arXiv papers in data/candidates.json; they are triaged by hand (see AGENTS.md).
      - run: python scripts/discover.py
        env:
          S2_API_KEY: ${{ secrets.S2_API_KEY }}
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/candidates.json
          if ! git diff --cached --quiet; then
            git commit -m "Update radar candidates"
            git push
          fi
