id: tah2-1-7b
name: TaH2-1.7B
paper: "2609.35748"
org: [Tsinghua-NICS-EFC]
hf: [nics-efc/TaH2-1.7B-max2, nics-efc/TaH2-1.7B-max4, nics-efc/TaH2-1.7B-max8]
params: "1.7B backbone + 46.16M updater and decider"
tokens: "3.4B (3 epochs over 273K post-training samples)"
context: "16,384 (training length); max_position_embeddings 32768"
passes:
  default: "up to 2, 4, 8 (max2, max4, max8; decider threshold 0.5)"
  range: "tah_max_iter overrides the cap; paper runs max8 at 4, 8 and 12"
kv: per-pass
license: apache-2.0
inference: [custom]
notes:
  en: >-
    Three post-trained versions of Qwen3-1.7B-Base that share one recipe and differ only in max_iter, the most full
    28-layer passes a token may take: 2, 4 or 8 (the depth ceiling M of the paper, set at training time and read from
    tah_config.json). After each pass a learned iteration decider (threshold 0.5) decides per token whether to run
    another pass; later passes take the output of a small MLP updater that reinjects the token embedding and maps the
    previous final hidden state back to the input space, and the output mixes the passes' predictions by their stopping
    probabilities (stop_prob_mix). Backbone, updater and decider are trained jointly for three epochs on the 1.7B subset of
    nics-efc/TaH2-amteam-tool (math, code, science and tool-use prompts with responses regenerated by Qwen3-8B), using
    online labels that mark whether another pass lowers the next-token loss. Each iteration depth keeps its own KV cache,
    and a query at depth m attends to executed states at earlier or equal positions and depths up to m. The paper reports
    that M=2 gives the best accuracy-compute trade-off while M=4 and 8 reach higher peak accuracy; on AIME24-26 the mean
    depth is 1.23, 1.49 and 2.22 for the three models (Table 12). Inference needs the tah2 package from the GitHub repo,
    either TaHForCausalLM or the bundled engine adapted from mini-SGLang; the max2 card's snippet imports the older tah
    package, which lacks the Qwen3MLPIterDecider and input updater these checkpoints use, while the max4 and max8 cards
    use tah2. nics-efc/TaH2-1.7B-Standard is the single-pass baseline trained on the same data and is not listed; the
    paper's 4B and 8B TaH2 models are not on the Hub.
  zh: >-
    三个模型都由 Qwen3-1.7B-Base 按同一配方后训练得到，区别只在 max_iter，即每个 token 最多跑几遍完整的 28 层：2、4 或 8（即论文中的深度上限 M，训练时设定，推理时从 tah_config.json 读取）。每跑完一遍，学习得到的迭代决策器（阈值 0.5）逐 token 决定是否再跑一遍；后续各遍的输入来自一个小型 MLP updater，它重新注入 token 嵌入，并把上一遍的最终隐藏状态映射回输入空间；输出按各遍的停止概率混合各遍的预测（stop_prob_mix）。主干、updater 和决策器在 nics-efc/TaH2-amteam-tool 的 1.7B 子集（数学、代码、科学和工具调用 prompt，回答由 Qwen3-8B 重新生成）上联合训练三个 epoch，在线标签标出再跑一遍能否降低 next-token loss。每个迭代深度各存一份 KV cache，深度 m 的 query 关注位置不晚于自身、深度不超过 m 的已执行状态。论文称 M=2 的准确率与计算量权衡最好，M=4 和 8 的峰值准确率更高；在 AIME24-26 上三个模型的平均深度分别为 1.23、1.49 和 2.22（Table 12）。推理需要 GitHub 仓库中的 tah2 包，可用 TaHForCausalLM 或改编自 mini-SGLang 的自带引擎；max2 的模型卡示例导入的是旧的 tah 包，它没有这些 checkpoint 所用的 Qwen3MLPIterDecider 和 input updater，max4 和 max8 的模型卡用的是 tah2。nics-efc/TaH2-1.7B-Standard 是用相同数据训练的单遍基线，未列出；论文中的 4B 和 8B TaH2 模型没有发布到 Hub。
ref: >-
  Model cards of the three repos (at most two, four or eight iterations per token, duo attention, decider threshold
  0.5, stop_prob_mix, 1.7B subset of TaH2 AMTeam Tool, loading snippets) and HF API (cardData.license apache-2.0;
  safetensors.total 1,720,574,976 counts only the backbone file); tah_config.json (max_iter 2/4/8, Qwen3MLPIterDecider
  threshold 0.5, Qwen3MLPUpdater, iter_attention_mode duo, weighted_hidden_method stop_prob_mix) and config.json
  (Qwen3ForCausalLM, 28 layers, max_position_embeddings 32768); nics-efc TaH2 collection and the TaH2-1.7B-Standard card
  (standard single-pass Qwen3-1.7B); GitHub README (checkpoint table, bundled mini-SGLang engine, --tah_max_iter
  override, data table with 273,195 samples and 1,099,413,406 train tokens for the 1.7B subset, recipes sft_tah,
  sft_tah_max4 and sft_tah_max8) and tah2/minisgl/README.md (tah_max_iter, --tah-max-iter); tah2/model/causal_cache.py
  and tah2/minisgl/models/tah_qwen3.py (KV kept per iteration depth, updater inputs); tah/model/iter_decider.py (no
  Qwen3MLPIterDecider in the old package); paper Section 4.1 (architecture), Section 5.1 (273K samples, three epochs,
  16,384-token context, 3.4B tokens, 32K evaluation length, threshold 0.5), Section 5.2 (M=2 trade-off, higher peaks for
  M=4 and 8), Table 7 (1720.57M backbone, 20.98M updater, 25.18M decider), Appendix A.2.1 (each iteration keeps its own
  KV cache), Appendix B.2 and Table 12 (inference ceilings 4, 8 and 12; mean depths), Section 5.3 (4B and 8B models).
