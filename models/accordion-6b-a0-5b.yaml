id: accordion-6b-a0-5b
name: Accordion-6B-A0.5B
paper: "2610.32492"
hf: [btzyd/Accordion-6B-A0.5B-RL, btzyd/Accordion-6B-A0.5B-SFT, btzyd/Accordion-6B-A0.5B-Base-32K, btzyd/Accordion-6B-A0.5B-Base-8K]
params: "6.0B"
active_params: "0.54B (non-embedding, one unlooped pass)"
tokens: "3.6T, plus 50B at 32K context, then SFT and RL"
context: "32K / 32K / 32K / 8K"
passes:
  default: "1 (loop_k 0)"
  range: "loop_k 0, 3, 6, 9 or 12 (24-36 layer executions)"
kv: per-pass
license: "other (not named on the cards)"
inference: [transformers-remote-code, vllm]
notes:
  en: >-
    Accordion is a 24-layer MoE (128 routed experts with top-8 routing plus one shared expert) trained from scratch and
    released at four stages: Base-8K after 3.6T tokens, Base-32K after 50B more tokens at 32K context, SFT on
    reasoning conversations with thinking traces, and RL, which the cards call the final model (three RL domain experts
    merged, then 10 steps of multi-teacher on-policy distillation). Looping repeats single layers in place: with budget
    k, the first k of layers 7-18 each run a second time right after their first pass, with the second pass scaled by a
    zero-initialised per-channel tanh gate and routed with a separate expert-selection bias. Training sampled k from
    {0, 3, 6, 9, 12} for each micro-batch, giving 24 to 36 layer executions per token; config.json sets loop_k 0,
    loop_generate takes loop_k per call and the SFT and RL card examples use loop_k 12, while other k values or layer
    sets (loop_layers_active) run but were never trained. Every layer execution keeps its own KV-cache slot, so at
    k = 12 the cache is 1.5 times its k = 0 size. In transformers the remote code must generate with loop_generate
    because model.generate() is not supported; vLLM serving needs vllm==0.24.0 plus the authors' accordion-vllm plugin
    and runs one budget per engine, set by LOOPMOE_K. The cards give ≈6.0B total and ≈0.54B active non-embedding
    parameters; the paper gives 6.03B and 0.54B (0.74B including the output head), and the safetensors total is
    6,027,376,128. The cards set license: other without naming a license, while the GitHub code (Accordion-Loop) is
    Apache-2.0.
  zh: >-
    Accordion 是从头训练的 24 层 MoE（128 个路由专家取 top-8，另加 1 个共享专家），按四个阶段发布：3.6T token 后的 Base-8K，再用 50B token 在 32K 上下文继续训练的 Base-32K，在带思考轨迹的推理对话上 SFT 的版本，以及模型卡称为最终模型的 RL 版（三个 RL 领域专家合并后，再做 10 步多教师 on-policy 蒸馏）。循环方式是单层原地重复：预算为 k 时，第 7-18 层中的前 k 层在第一遍之后立即再跑一遍，第二遍输出乘以零初始化的逐通道 tanh 门控，路由时使用单独的专家选择 bias。训练时每个 micro-batch 从 {0, 3, 6, 9, 12} 中采样 k，对应每 token 24 到 36 次层计算；config.json 中 loop_k 为 0，loop_generate 每次调用可指定 loop_k，SFT 和 RL 模型卡的示例用 loop_k 12；其他 k 值或层组合（loop_layers_active）可以运行，但从未训练过。每次层计算各有一个 KV cache 槽位，k = 12 时缓存是 k = 0 时的 1.5 倍。在 transformers 中必须用远程代码里的 loop_generate 生成，不支持 model.generate()；vLLM 部署需要 vllm==0.24.0 加作者的 accordion-vllm 插件，每个引擎只跑一个预算，由 LOOPMOE_K 设定。模型卡给出约 6.0B 总参数和约 0.54B 激活非嵌入参数，论文给出 6.03B 和 0.54B（含输出头为 0.74B），safetensors 总数为 6,027,376,128。模型卡的 license 为 other，没有写明具体许可；GitHub 代码（Accordion-Loop）为 Apache-2.0。
ref: >-
  Model cards of the four repos (≈6.0B total and ≈0.54B active non-embedding parameters; layers 7-18 loopable; k in
  {0, 3, 6, 9, 12} with 24-36 layer executions; Model family table with stages and 8K or 32K context; RL card: final
  model and its RL, merge and distillation steps; Base-8K card: 3T, 0.15T and 0.45T tokens, 3.6T in total; Base-32K
  card: 50B tokens, 5,960 steps; SFT card: 8,614 steps on reasoning-style conversations; Architecture section: each
  layer execution keeps its own KV cache, ×1.5 at k = 12; Usage: trust_remote_code, loop_generate, model.generate()
  not supported, vLLM plugin with LOOPMOE_K, untrained budgets run but are generally worse); HF API (cardData.license
  other with no license_name or license_link, safetensors.total 6,027,376,128, base_model chain Base-8K, Base-32K,
  SFT, RL); config.json (loop_layers 7-18, loop_budgets [0, 3, 6, 9, 12], loop_k 0, max_position_embeddings 32768 or
  8192); modeling_loopmoe.py (LoopCache with one slot per layer execution; plan() takes the first k loopable layers);
  paper Section 2.1 (fixed-prefix layer looping, tanh gates, per-pass balancing bias, KV storage (L+k)/L), Sections
  3.1-3.2 and Tables 4-5 (3.0T, 150B and 450B stages, 50B context extension, 6.03B total and 0.54B active, 0.74B with
  the output head); GitHub btzyd/Accordion-Loop (README model table, vllm_plugin README and accordion_vllm/model.py
  with a separate vLLM Attention instance per layer execution and vllm==0.24.0, Apache-2.0 LICENSE). Authorship: the
  btzyd GitHub profile is Yudong Zhang (Tsinghua University), the paper's first author and arXiv submitter, and the
  cards link the paper and btzyd/Accordion-Loop, which links the btzyd HF collection of these four repos.
added: "2026-11-24"
