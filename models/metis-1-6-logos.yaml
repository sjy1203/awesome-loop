  config.json (num_passes 2, max_passes 5, attention_layer_indices [5, 10, 15], max_position_embeddings 131072);
  configuration_metis16.py docstring (fixed num_passes=2 policy); modeling_metis16.py (module docstring: one Mamba
  state and one key/value cache per (layer, pass), 34 and 6 for Logos; Metis16Cache keyed by (layer, pass); crop raises
  an error); Dromos docs/ARCHITECTURE.md (state per (pass, layer)); paper Section 3 with footnote 1 (exactly two passes;
