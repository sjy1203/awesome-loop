id: metis-1-6-praxis
name: Metis-1.6 Praxis
paper: "2610.37903"
org: [Lernex]
hf:
  - Lernex/Metis-1.6-Praxis
  - Lernex/Metis-1.6-Praxis-Base
  - Lernex/Metis-1.6-Praxis-FP8
  - Lernex/Metis-1.6-Praxis-NVFP4
  - Lernex/Metis-1.6-Praxis-MLX-4bit
  - Lernex/Metis-1.6-Praxis-MLX-8bit
  - Lernex/Metis-1.6-Praxis-GGUF
params: "2.94B"
active_params: "0.46B per pass; 927,204,204 per token over both passes (paper Table 1)"
tokens: "804.76B pretraining; 1,022.77B with context extension and SFT"
context: "131,072 (extended from 4,096)"
passes:
