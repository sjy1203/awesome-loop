id: dfm-mimir
name: DFM Mimir
paper: "2608.13517"
org: [Danish Foundation Models]
hf:
  - danish-foundation-models/DFM-Mimir-v1.5
  - danish-foundation-models/DFM-Mimir
  - danish-foundation-models/DFM-Mimir-v1.5-GGUF
  - danish-foundation-models/DFM-Mimir-GGUF
params: "1.787B"
tokens: "103B / ~70.5B per epoch (v1.5 / v1); total not stated"
context: "4,096"
passes:
  default: "8 module calls (H_cycles 2, L_cycles 3)"
  range: "L_cycles 1-5 degrade gracefully; H_cycles 1 or 3 break it (paper, v1)"
kv: per-pass
license: apache-2.0
inference: [transformers, vllm, gguf]
notes:
  en: >-
    Danish and English chat models (Gemma 4 tokenizer and chat template) from Danish Foundation Models, trained from
    random initialization on instruction, reasoning, tool-use, multilingual and synthetic data without web-scale
    pretraining. v1 was trained on 161 datasets of about 70.5B tokens per epoch; v1.5 continues the v1 run on later
    mixtures, ending with DFM11 (103,214,604,702 sampled tokens per epoch), and is the EMA checkpoint at step
    2,877,261. Both use the HRM-Text layout of two 16-layer stacks applied as LLLHLLLH (H_cycles 2, L_cycles 3); v1
    backpropagates through the last five module applications and v1.5 through all eight, which is the only difference
    between the two config.json files (L_bp_cycles). In the paper's test-time sweep on v1, changing the number of L
    applications (1-5) degrades scores gracefully, while 1 or 3 H cycles break the model. The cards ask for a PrefixLM
    attention mask and, for v1.5, a transformers or vLLM build with native hrm_text support; the upstream transformers
    and vLLM implementations keep one KV slot per stack call. The official GGUF repos (BF16, Q8_0, Q4_K_M) need the DFM
    Mimir app or the schneiderkamplab llama.cpp fork; the GGUF cards make no claim of compatibility with stock
    llama.cpp or Ollama. The v1 card calls the model ~1B, the v1.5 card gives 1,786,775,040 total parameters (0.981B
    without the input embedding and output head) and the paper gives 1.78B; the v1 card lists 1,750,000 training
    steps, where the paper gives 1.65M steps for v1 and 1.2M further steps for v1.5. The schneiderkamplab FP8, AWQ-FP4
    and FP4-MLX quantizations of v1 are not listed, since neither the model cards nor the paper present them as
    official releases.
  zh: >-
    Danish Foundation Models 发布的丹麦语和英语对话模型（使用 Gemma 4 tokenizer 和 chat template），从随机初始化开始，在指令、推理、工具调用、多语言和合成数据上训练，没有 web 规模的预训练。v1 在 161 个数据集上训练，每个 epoch 约 70.5B token；v1.5 在 v1 的基础上用后续数据混合继续训练，最后一个混合为 DFM11（每个 epoch 103,214,604,702 个采样 token），发布的是第 2,877,261 步的 EMA checkpoint。两者都采用 HRM-Text 结构：两个 16 层的栈按 LLLHLLLH 顺序执行（H_cycles 2，L_cycles 3）；v1 只反传最后五次模块调用，v1.5 反传全部八次，这也是两份 config.json 唯一的区别（L_bp_cycles）。论文在 v1 上做的测试时扫描显示，改变 L 的调用次数（1-5）时分数平缓下降，而 H 设为 1 或 3 时模型失效。模型卡要求使用 PrefixLM 注意力 mask，v1.5 模型卡还要求使用原生支持 hrm_text 的 transformers 或 vLLM 版本；上游 transformers 和 vLLM 的实现为每次栈调用各存一份 KV。官方 GGUF 仓库（BF16、Q8_0、Q4_K_M）需要 DFM Mimir 应用或 schneiderkamplab 的 llama.cpp 分支；GGUF 模型卡不声称兼容原版 llama.cpp 或 Ollama。v1 模型卡称其约 1B，v1.5 模型卡给出总参数 1,786,775,040（不含输入嵌入和输出头为 0.981B），论文给出 1.78B；v1 模型卡写训练 1,750,000 步，论文则写 v1 训练 1.65M 步、v1.5 再继续训练 1.2M 步。schneiderkamplab 发布的 v1 FP8、AWQ-FP4 和 FP4-MLX 量化版未列出，因为模型卡和论文都没有把它们作为官方版本。
ref: >-
  Model cards of danish-foundation-models/DFM-Mimir (1-billion-parameter, trained from scratch, 161 datasets,
  approximately 70.479 billion tokens per epoch; Model details: ~1B, 16 layers, context length 4,096, 1,750,000
  training steps, ~70.5B tokens per epoch, Apache 2.0; Usage instructions: Gemma4 tokenizer and chat template, PrefixLM
  attention mask) and DFM-Mimir-v1.5 (final epoch-10 EMA checkpoint at 2,877,261 steps continuing v1; 0.981B
  non-embedding/head and 1.787B total parameters; Model details: total 1,786,775,040, H / L cycles 2 / 3 with six L and
  two H executions, context 4,096, DFM11 103,214,604,702 sampled tokens; Usage instructions: Transformers/vLLM build
  with native hrm_text support); both config.json files (H_cycles 2, L_cycles 3, L_bp_cycles [0, 3] vs [3, 3],
  max_position_embeddings 4096); HF API of the four listed repos (cardData.license apache-2.0, 1,786,775,040
  parameters) and the two GGUF cards (Official GGUF conversions; DFM Mimir app or schneiderkamplab/llama.cpp fork);
  paper (arXiv v3) Abstract (1.78B, 70.5B and 103B tokens per epoch, links to both safetensors repos), Section 3
  (LLLHLLLH, 1.38B non-embedding and 0.40B embedding parameters, backpropagation through five vs all eight steps,
  1.65M and 1.2M steps), Table 9 (32 layers split between H and L, H cycles 2, L cycles 3) and Section 6 / Table 5
  (test-time recurrence sweep); kv from transformers modeling_hrm_text.py (one cache slot per stack call) and
  vllm-project/vllm#43098 (vLLM v0.24.0); the schneiderkamplab FP8, AWQ-FP4 and FP4-MLX repos were checked through
  their cards and HF API (base_model DFM-Mimir; not referenced by the DFM-Mimir cards or the paper).
